plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

def target = project.mcTarget
def economyCraftDependency = rootProject.ext.economyCraftDependency("neoforge", target)

dependencies {
    minecraft "com.mojang:minecraft:${target.mc}"
    neoForge "net.neoforged:neoforge:${rootProject.findProperty('neoforge_version') ?: target.neoforge}"

    if (target.obfuscated) {
        mappings loom.officialMojangMappings()
        modCompileOnly economyCraftDependency
        common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    } else {
        compileOnly economyCraftDependency
        common(project(path: ":common")) { transitive = false }
    }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

processResources {
    def (mcLo, mcHi) = rootProject.ext.mcRange(target)
    def nfLo = (rootProject.findProperty("neoforge_line_lo") ?: target.neoforgeLineLo).toString()
    def nfHi = (rootProject.findProperty("neoforge_line_hi") ?: target.neoforgeLineHi).toString()

    inputs.property "version", project.version
    inputs.property "mcLo", mcLo
    inputs.property "mcHi", mcHi
    inputs.property "nfLo", nfLo
    inputs.property "nfHi", nfHi
    inputs.property "economycraftVersion", rootProject.economycraft_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version,
                mcLo: mcLo, mcHi: mcHi, nfLo: nfLo, nfHi: nfHi,
                economycraftVersion: rootProject.economycraft_version
    }
}

if (target.obfuscated) {
    shadowJar {
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = "dev-shadow"
    }
    remapJar {
        inputFile.set(shadowJar.archiveFile)
        archiveVersion = ""
    }
} else {
    jar { archiveClassifier = "raw" }
    shadowJar {
        dependsOn jar
        mainSpec.sourcePaths.clear()
        from(zipTree(jar.archiveFile))
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = null
    }
}
