plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

def target = project.mcTarget
def economyCraftDependency = rootProject.ext.economyCraftDependency("fabric", target)
def fabricApiVersion = rootProject.findProperty('fabric_api_version') ?: target.fabricApi

dependencies {
    minecraft "com.mojang:minecraft:${target.mc}"

    if (target.obfuscated) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        modCompileOnly economyCraftDependency
        common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    } else {
        implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
        compileOnly economyCraftDependency
        common(project(path: ":common")) { transitive = false }
    }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")
}

processResources {
    def (mcLo, mcHi) = rootProject.ext.mcRange(target)
    def predicate = (target.minecraftPredicate ?: ">=${mcLo} <${mcHi}").toString()

    inputs.property "version", project.version
    inputs.property "mcPredicate", predicate
    inputs.property "economycraftVersion", rootProject.economycraft_version

    filesMatching("fabric.mod.json") {
        expand version: project.version,
                mcPredicate: predicate,
                economycraftVersion: rootProject.economycraft_version
    }
}

if (target.obfuscated) {
    shadowJar {
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = "dev-shadow"
    }
    remapJar {
        inputFile.set(shadowJar.archiveFile)
        archiveVersion = ""
    }
} else {
    jar { archiveClassifier = "raw" }
    shadowJar {
        dependsOn jar
        mainSpec.sourcePaths.clear()
        from(zipTree(jar.archiveFile))
        configurations = [project.configurations.shadowBundle]
        archiveClassifier = null
    }
}
